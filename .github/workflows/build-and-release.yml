name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # 1. RUN TESTS (Linux)
  # ========================================================
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Tests
        run: uv run pytest

  # ========================================================
  # 2. BUILD PACKAGES (Windows & Linux)
  # ========================================================
  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: Linux
            sep: ":"
            zip_name: GeneratorZaswiadczen-Linux.zip
            launcher_ext: ""
            archive_cmd: |
              cd dist
              zip -r ../GeneratorZaswiadczen-Linux.zip GeneratorZaswiadczen/
              cd ..
              sha256sum GeneratorZaswiadczen-Linux.zip > GeneratorZaswiadczen-Linux.zip.sha256
          - os: windows-latest
            platform_name: Windows
            sep: ";"
            zip_name: GeneratorZaswiadczen-Windows.zip
            launcher_ext: ".exe"
            archive_cmd: |
              Compress-Archive -Path dist\GeneratorZaswiadczen -DestinationPath GeneratorZaswiadczen-Windows.zip -Force
              $hash = (Get-FileHash -Path GeneratorZaswiadczen-Windows.zip -Algorithm SHA256).Hash.ToLower()
              Set-Content -Path "GeneratorZaswiadczen-Windows.zip.sha256" -Value "$hash  GeneratorZaswiadczen-Windows.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: uv sync --all-groups

      # --- Build 1: Main Application (onedir payload) ---
      - name: Build Generator Payload
        run: >
          uv run pyinstaller
          --name "GeneratorZaswiadczen"
          --onedir
          --noconsole
          --add-data "src/johnmamapdfv2/assets${{ matrix.sep }}assets"
          --add-data "src/johnmamapdfv2/web${{ matrix.sep }}web"
          src/johnmamapdfv2/app.py

      # --- Build 2: Lightweight Launcher (onefile standalone) ---
      - name: Build Launcher
        run: >
          uv run pyinstaller
          --name "Launcher-${{ matrix.platform_name }}"
          --onefile
          --noconsole
          src/launcher/launcher.py

      # --- Archive Generator & Calculate SHA256 (Native Shells) ---
      - name: Package Payload and Compute SHA256 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ${{ matrix.archive_cmd }}

      - name: Package Payload and Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ${{ matrix.archive_cmd }}

      # --- Upload Build Artifacts to Workflow Run ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform_name }}
          path: |
            ${{ matrix.zip_name }}
            ${{ matrix.zip_name }}.sha256
            dist/Launcher-${{ matrix.platform_name }}${{ matrix.launcher_ext }}

  # ========================================================
  # 3. CREATE GITHUB RELEASE (Only on git tags, e.g. v1.0.0)
  # ========================================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/*.zip
            release-files/*.sha256
            release-files/Launcher-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
