name: CI

on:
  # Tests are opt-in: run from the Actions tab, or automatically on pull
  # requests. Pushes to main go straight to deploy.
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm run build
      - run: npm run smoke

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Google Chrome; e2e.mjs picks it up automatically
      # (CHROME_PATH overrides the search).
      - run: npm run e2e
      - run: npm run e2e:base
